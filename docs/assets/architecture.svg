<svg xmlns="http://www.w3.org/2000/svg" width="878" height="204" viewBox="0 0 878 204" role="img" aria-labelledby="title description">
  <title id="title">Navigation Agent 工程架构</title>
  <desc id="description">统一 Agent 连接独立的导航模型与执行后端适配器。内置 LightNav、Go2 和 MuJoCo；虚线 Custom 插槽表示待实现和验证的扩展点，连线不表示执行顺序。</desc>
  <!-- 复用官网原始 SVG 图形：https://novaxis-robot-group.github.io/navigation-agent-site/#architecture；复用当前图元与机械狗渲染图，仅调整为 README 静态布局。机械狗来源与 BSD-3-Clause 许可见 THIRD_PARTY_NOTICES.md。 -->
  <style>
    text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #5e6a67; font-size: 16px; }
    .heading { font-size: 14px; letter-spacing: 1.12px; }
    .agent { fill: #2c3531; font-size: 20px; font-weight: 600; }
    .module { stroke-width: 1.3; }
    .architecture-slot { fill: #ffffff; stroke: #e1e5e1; }
    .architecture-extension { stroke: #526a7a; stroke-width: 1.4; }
    .custom { opacity: .6; }
    .custom .architecture-slot { fill: none; stroke: #526a7a; stroke-dasharray: 4 5; }
    .architecture-network-links { fill: none; stroke: #829aab; stroke-width: 1; opacity: .45; }
    .architecture-network-nodes { fill: #ffffff; stroke: #486562; stroke-width: 1.5; }
    .architecture-network-hidden { fill: #7d9d9c; stroke-width: 1; }
    .architecture-cart { stroke: #486562; stroke-width: 1.5; stroke-linejoin: round; }
    .architecture-cart-dark { fill: #2c3531; }
    .architecture-cart-rim { fill: #486562; }
    .architecture-cart-disc { fill: #7d9d9c; }
    .scene-shadow { fill: #7d9d9c; opacity: .1; stroke: none; }
    .scene-top { fill: #ffffff; stroke: #486562; }
    .scene-side { fill: #7d9d9c; fill-opacity: .3; stroke: #486562; }
    .scene-circuit { fill: none; stroke: #829aab; stroke-width: 1.2; }
    .scene-core-light { fill: #7d9d9c; stroke: none; }
    .joint { stroke: #829aab; stroke-width: 1; }
    .socket { fill: #ffffff; stroke: #7d9d9c; }
  </style>
  <rect width="878" height="204" fill="#eef1ed"/>
  <defs>
<g id="scene-robot">
            <ellipse class="scene-shadow" cx="0" cy="28" rx="23.2960" ry="11.6480"/>
            <image class="scene-robot-image" href="data:image/webp;base64," x="-41.4151" y="-15.7447" width="82.8302" height="62.1227" preserveAspectRatio="xMidYMid meet"/>
          </g>
<g id="scene-core">
            <ellipse class="scene-shadow" cy="27" rx="43" ry="22"/>
            <path class="scene-top" d="M0-49 35-29 0-9-35-29Z"/>
            <path class="scene-side" d="M-35-29V7L0 27 35 7V-29L0-9V27"/>
            <path class="scene-circuit" d="M-25-12V0L-12 8M25-12V0L12 8"/>
            <ellipse class="scene-core-light" cy="-29" rx="10" ry="6"/>
          </g>
  </defs>
  <text class="heading" x="126" y="32">NAVIGATION MODELS</text>
  <text class="heading" x="694" y="32">EXECUTION BACKENDS</text>
  <g transform="translate(16 62)">
    <g class="module custom">
                  <rect class="architecture-slot" x="8" y="8" width="88" height="64" rx="8"/>
                  <path class="architecture-extension" d="M52 29v22M41 40h22"/>

    </g>
    <text x="52" y="112">Custom +</text>
  </g>
  <g transform="translate(132 62)">
    <g class="module">
                  <rect class="architecture-slot" x="8" y="8" width="88" height="64" rx="8"/>
                  <!-- 通用网络符号，不对应 LightNav 的实际层数或节点数。 -->
                  <g class="architecture-network-links">
                    <path d="M32 28 52 22 M32 28 52 34 M32 28 52 46 M32 28 52 58"/>
                    <path d="M32 40 52 22 M32 40 52 34 M32 40 52 46 M32 40 52 58"/>
                    <path d="M32 52 52 22 M32 52 52 34 M32 52 52 46 M32 52 52 58"/>
                    <path d="M52 22 72 31 M52 22 72 49"/>
                    <path d="M52 34 72 31 M52 34 72 49"/>
                    <path d="M52 46 72 31 M52 46 72 49"/>
                    <path d="M52 58 72 31 M52 58 72 49"/>
                  </g>
                  <g class="architecture-network-nodes">
                    <circle cx="32" cy="28" r="3.5"/>
                    <circle cx="32" cy="40" r="3.5"/>
                    <circle cx="32" cy="52" r="3.5"/>
                  </g>
                  <g class="architecture-network-nodes architecture-network-hidden">
                    <circle cx="52" cy="22" r="3.5"/>
                    <circle cx="52" cy="34" r="3.5"/>
                    <circle cx="52" cy="46" r="3.5"/>
                    <circle cx="52" cy="58" r="3.5"/>
                  </g>
                  <g class="architecture-network-nodes">
                    <circle cx="72" cy="31" r="3.5"/>
                    <circle cx="72" cy="49" r="3.5"/>
                  </g>

    </g>
    <text x="52" y="112">LightNav</text>
  </g>
  <g transform="translate(526 62)">
    <g class="module">
                  <rect class="architecture-slot" x="8" y="8" width="88" height="64" rx="8"/>
                  <g transform="translate(52 30.7052) scale(0.860529)"><use href="#scene-robot"/></g>

    </g>
    <text x="52" y="112">Quadruped</text>
  </g>
  <g transform="translate(642 62)">
    <g class="module">
                  <rect class="architecture-slot" x="8" y="8" width="88" height="64" rx="8"/>
                  <ellipse class="scene-shadow" cx="52" cy="61" rx="24" ry="8"/>
                  <g class="architecture-cart">
                    <path class="architecture-cart-dark" d="M36 37a16 6 0 0 1 32 0l2 16a18 6 0 0 1-36 0Z"/>
                    <path class="architecture-cart-rim" d="M32 34a20 7 0 0 0 40 0v4a20 7 0 0 1-40 0Z"/>
                    <ellipse class="architecture-cart-disc" cx="52" cy="34" rx="20" ry="7"/>
                    <path class="architecture-cart-dark" d="M45 22.5a7 3.5 0 0 0 14 0v6.5a7 3.5 0 0 1-14 0Z"/>
                    <ellipse class="architecture-cart-dark" cx="52" cy="22.5" rx="7" ry="3.5"/>
                  </g>

    </g>
    <text x="52" y="112">MuJoCo · Sim</text>
  </g>
  <g transform="translate(758 62)">
    <g class="module custom">
                  <rect class="architecture-slot" x="8" y="8" width="88" height="64" rx="8"/>
                  <path class="architecture-extension" d="M52 29v22M41 40h22"/>

    </g>
    <text x="52" y="112">Custom +</text>
  </g>
  <path class="joint" d="M239 108H338"/>
  <rect class="socket" x="239" y="100" width="7" height="17" rx="3"/>
  <rect class="socket" x="331" y="100" width="7" height="17" rx="3"/>
  <path class="joint" d="M424 108H523"/>
  <rect class="socket" x="424" y="100" width="7" height="17" rx="3"/>
  <rect class="socket" x="516" y="100" width="7" height="17" rx="3"/>
  <use href="#scene-core" transform="translate(381 105)"/>
  <text class="agent" x="381" y="174">Agent</text>
</svg>
